# Track simulation configuration
# window_* = the resolution the sim UI renders at during normal (interactive)
# use (larger = panels/layout fit).
window_width=1280
window_height=720
# capture_* = the STREAMING frame size. This is the single source of truth for
# the headerless ASR_STREAM build: the renderer draws directly at this size
# (no downscale) and asr-server/asr-stream-run reads the same value to feed
# ffmpeg's rawvideo -s, then ffmpeg scales UP to 1280x720 for the stream. They
# must ALWAYS match in size or the raw stream desyncs (doubled/garbled video).
# Lowering capture cuts the renderer's pixel work (and push bandwidth):
#   1280x720 = 0.92 MP (old default)
#   960x540  = 0.52 MP -> ~45% fewer pixels (current)
#   640x360  = 0.23 MP -> ~75% fewer (only sensible if the HUD panes are scaled
#                        down to match, since they're fixed capture pixels).
# The full 960x540 RGBA frame is ~2 MiB (> the ~1 MiB pipe buffer); the blocking
# writer in streamer.py (_write_all) stitches full frames across writes, so this
# is safe.
capture_width=960
capture_height=540
# render_fps = interactive render loop target; render_fps_streaming = frame-rate
# cap used ONLY when ASR_STREAM=1. Must stay >=20 to keep real-time physics
# (frame_dt is capped at 0.05s with sim_steps=1). The encoder output is paced to
# TRACK_FPS (~12) by the streamer, so drawing faster just wastes CPU on frames that
# get dropped — 20 is the efficient floor. Override at runtime with env ASR_RENDER_FPS.
render_fps=60
render_fps_streaming=20
# stream_show_panes: when set to 1 AND ASR_STREAM=1, the stream shows a cached
# leaderboard + bottom-stats overlay (a thin HUD) instead of a pure fullscreen
# track. The overlay is re-rendered only when the standings change, so enabling it
# costs almost nothing per frame. 0 = pure fullscreen track (default, lowest CPU).
stream_show_panes=1
# HUD pane sizes used when stream_show_panes=1 (also used by the interactive UI):
#   stream_leaderboard_width   = right-hand leaderboard column width
#   stream_bottom_stats_height = full-width bottom-stats strip height
# The race (track) pane takes whatever space is left over, so making these
# SMALLER enlarges the on-track view (and vice-versa). The values below are
# scaled to keep the panes proportional at the reduced 960x540 capture
# (0.75x the old 1280x720 layout: 280*0.75=210, 220*0.75=165).
stream_leaderboard_width=210
stream_bottom_stats_height=165
tracks_dir=tracks
cars_dir=cars
default_track=cocorp.track
training_races=10

# Series configuration
# series_name: display name for the series (empty disables series UI)
series_name=bboogs
# series_races: number of races in the series (0 = use training_races / infinite mode)
series_races=10
# series_laps: number of laps required to complete a series race
# (the last unwrecked car finishing this many laps ends the race)
series_laps=5
# session_mode: 0 = classic series/infinite mode, 1 = session mode with qualifying
session_mode=1
# qualifying_laps: lap limit for each qualifying race (default = series_laps if 0)
qualifying_laps=3
# qualifying_races: number of qualifying races per car type (default 1)
qualifying_races=3
# series_logo: path to series logo image (relative to images/logos/ or absolute path)
series_logo=

# Simulation
# simulation_speed: target sim-seconds per real second during training simulation.
# Higher values make training finish faster. Physics still advances in fixed 0.02s
# substeps, so race outcomes are identical to un-simulated races.
simulation_speed=1000
# sim_steps_cap: maximum number of 0.02s physics sub-steps per rendered frame.
# Higher values let the sim run faster on capable machines; lower values keep
# the UI responsive on slower hardware.
sim_steps_cap=8000
