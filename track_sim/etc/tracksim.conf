# Track simulation configuration
# window_* = the resolution the sim UI renders at during normal (interactive)
# use (larger = panels/layout fit).
window_width=1280
window_height=720
# capture_* = the STREAMING frame size. This is the single source of truth for
# the headerless ASR_STREAM build: the renderer draws directly at this size
# (no downscale) and asr-server/asr-stream-run reads the same value to feed
# ffmpeg's rawvideo -s. They must ALWAYS match in size or the raw stream
# desyncs (doubled/garbled video). ffmpeg upscales this to 720p for the stream.
# Keep it small (default 640x360) so the Pi has CPU headroom to render & push
# MORE distinct frames/sec — that's what removes the choppy/low-fps animation
# in the stream, at a small cost in on-screen sharpness (ffmpeg upscales to
# 720p anyway). A full 640x360 RGBA frame is ~0.9 MiB (< the ~1 MiB pipe
# buffer) and the blocking writer in streamer.py stitches across writes for
# larger sizes. NOTE: width*height*4 should stay <= ~1.4 MiB (width*height <=
# ~368640) so a full frame can be staged in the enlarged pipe without splitting.
capture_width=640
capture_height=360
# render_fps = interactive render loop target; render_fps_streaming = frame-rate
# cap used ONLY when ASR_STREAM=1 (>=20 needed to keep real-time physics).
# Override the streaming cap at runtime with env ASR_RENDER_FPS.
render_fps=60
render_fps_streaming=30
# stream_show_panes: when set to 1 AND ASR_STREAM=1, the stream shows a cached
# leaderboard + bottom-stats overlay (a thin HUD) instead of a pure fullscreen
# track. The overlay is re-rendered only when the standings change, so enabling it
# costs almost nothing per frame. 0 = pure fullscreen track (default, lowest CPU).
stream_show_panes=0
tracks_dir=tracks
cars_dir=cars
default_track=cocorp.track
training_races=10

# Series configuration
# series_name: display name for the series (empty disables series UI)
series_name=bboogs
# series_races: number of races in the series (0 = use training_races / infinite mode)
series_races=10
# series_laps: number of laps required to complete a series race
# (the last unwrecked car finishing this many laps ends the race)
series_laps=3
# series_logo: path to series logo image (relative to images/logos/ or absolute path)
series_logo=

# Simulation
# simulation_speed: target sim-seconds per real second during training simulation.
# Higher values make training finish faster. Physics still advances in fixed 0.02s
# substeps, so race outcomes are identical to un-simulated races.
simulation_speed=1000
# sim_steps_cap: maximum number of 0.02s physics sub-steps per rendered frame.
# Higher values let the sim run faster on capable machines; lower values keep
# the UI responsive on slower hardware.
sim_steps_cap=8000
