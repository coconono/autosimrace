# Track simulation configuration
window_width=1600
window_height=900
tracks_dir=tracks
cars_dir=cars
default_track=cocorp.track
training_races=10

# Race series configuration
# series_name: display name for the series (empty disables series UI)
series_name=bboogs
# series_races: number of races in the series (0 = use training_races / infinite mode)
series_races=10
# series_logo: path to series logo image (relative to images/logos/ or absolute path)
series_logo=
